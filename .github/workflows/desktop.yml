name: Pacchetti desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # Un tag non si annulla mai: se il tag viene ripushato (o un run viene
  # rilanciato a mano) la build già in corso deve arrivare in fondo, altrimenti
  # la release resta senza qualche pacchetto. Sui rami vale l'ultimo push.
  # I runner macOS Intel possono restare in coda a lungo: annullare un tag
  # mentre aspetta il runner è il modo più silenzioso di perdere i .dmg.
  group: "desktop-${{ github.ref }}"
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Un avvio rotto deve fermare la release, non arrivare all'utente: qui il
  # pacchetto Linux viene aperto sotto un display virtuale e si controlla che
  # la pagina dell'app sia davvero caricata. Il job «build» lo aspetta, quindi
  # se l'avvio non riesce i pacchetti non vengono nemmeno costruiti.
  avvio:
    name: Avvio con display virtuale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa le dipendenze di test
        run: npm ci --no-audit --no-fund

      - name: Controlli sui dati
        run: npm test

      - name: Prepara il contenuto dell'app
        run: node scripts/prepare-desktop.cjs

      - name: Installa Electron
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # Solo la cartella non compressa: basta per provare l'avvio e costa meno
      # di .deb e AppImage, che servono soltanto alla release.
      - name: Costruisce il pacchetto Linux non compresso
        working-directory: desktop
        run: npx electron-builder --linux dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Installa il display virtuale e le librerie di Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 \
            libasound2t64 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libxss1 libxtst6 libpango-1.0-0 libcairo2

      # --no-sandbox vale solo per questa prova: sui runner il sandbox di
      # Chromium non ha i privilegi che avrebbe su un computer normale.
      - name: Avvia l'app e verifica che la pagina carichi
        run: xvfb-run -a node scripts/smoke-avvio.cjs desktop/dist/linux-unpacked --no-sandbox

      - name: Conserva il registro dell'avvio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avvio-log
          path: artifacts/avvio-*.log
          if-no-files-found: ignore

  build:
    name: ${{ matrix.os }}
    needs: avvio
    # Sui push su main gira solo il job delle impronte: le build servono per i tag.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
          - os: windows-latest
            script: dist:win
            artifact: windows
          # Runner Intel: i runner macOS arm64 hanno code molto lunghe e possono
          # non essere assegnati. Da Intel si compilano entrambe le architetture.
          - os: macos-15-intel
            script: dist:mac
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Un pacchetto si costruisce solo da un sito che funziona: dati, viste,
      # link e pulsanti vengono controllati prima di impacchettare.
      - name: Installa le dipendenze di test
        run: npm ci --no-audit --no-fund

      - name: Verifica dati, rendering, link e pulsanti
        run: npm test

      - name: Prepara il contenuto dell'app
        run: node scripts/prepare-desktop.cjs

      - name: Installa Electron
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Genera i pacchetti
        working-directory: desktop
        shell: bash
        # Su macOS hdiutil a volte non riesce a smontare l'immagine appena
        # creata (Exit code 16). Un secondo tentativo risolve il problema.
        run: |
          npm run ${{ matrix.script }} || npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crea la versione portatile (ZIP)
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/win-unpacked/* -DestinationPath "desktop/dist/Naturopata-Digitale-Windows-portatile.zip"

      - name: Carica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: naturopata-digitale-${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      # latest*.yml sono i file che il programma installato legge per sapere
      # che esiste una versione nuova: senza di loro l'aggiornamento tace.
      - name: Pubblica nella release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/latest*.yml
          overwrite_files: true
          generate_release_notes: true
          # Un tag con un trattino (per esempio v1.3.20-prova) è una prova del
          # workflow: resta una prerelease, così non diventa «latest» e i
          # pulsanti di scarica/ continuano a puntare alla versione buona.
          prerelease: ${{ contains(github.ref_name, '-') }}

  checksums:
    name: Impronte SHA-256
    needs: build
    # Gira a fine release e anche sui push su main: così una release già
    # pubblicata riceve SHA256SUMS.txt senza rifare le build.
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Individua la release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
          fi
          if [[ -z "$tag" ]]; then
            echo "::notice::Nessuna release pubblicata, niente impronte da calcolare."
            echo "pronta=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pronta=1" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release di riferimento: $tag"

      - name: Allega il codice sorgente
        # Solo dal run del tag: sui push su main l'archivio sarebbe quello del
        # commit nuovo e finirebbe, con --clobber, sulla release precedente.
        if: steps.rel.outputs.pronta == '1' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          # Il sorgente della versione viaggia con i pacchetti: chi vuole
          # conservarlo o ricompilarselo non dipende dal repository online.
          git archive --format=zip --prefix=Naturopata-Digitale/ -o Naturopata-Digitale-Sorgenti.zip HEAD
          gh release upload "$TAG" Naturopata-Digitale-Sorgenti.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "Sorgenti allegati: $(du -h Naturopata-Digitale-Sorgenti.zip | cut -f1)"

      - name: Genera SHA256SUMS.txt
        id: somme
        if: steps.rel.outputs.pronta == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          DA_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          # GitHub calcola il digest SHA-256 di ogni allegato al momento del
          # caricamento: leggerlo dall'API evita di riscaricare centinaia di
          # megabyte e garantisce che il file coincida con i valori mostrati
          # dalla pagina di download.
          righe=0
          for tentativo in $(seq 1 10); do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '
              .assets[]
              | select(.name | startswith("Naturopata-Digitale-"))
              | select(.digest != null and (.digest | startswith("sha256:")))
              | "\(.digest | sub("^sha256:"; ""))  \(.name)"' 2>/dev/null | sort -k2 > SHA256SUMS.txt || true
            righe="$(wc -l < SHA256SUMS.txt)"
            if [[ "$righe" -ge 6 ]]; then
              echo "pronte=1" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Impronte disponibili: $righe, nuovo controllo tra 30 secondi."
            sleep 30
          done
          cat SHA256SUMS.txt
          if [[ "$(wc -l < SHA256SUMS.txt)" -lt 6 ]]; then
            if [[ "$DA_TAG" == "true" ]]; then
              echo "::error::Meno di sei pacchetti con impronta nella release $TAG."
              exit 1
            fi
            echo "::notice::Release $TAG incompleta, impronte rimandate."
            echo "pronte=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Allega SHA256SUMS.txt
        if: steps.somme.outputs.pronte == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  # Una release si dice pubblicata solo quando ci sono tutti i file. Senza
  # questo controllo un job macOS annullato mentre aspettava il runner lasciava
  # una release a metà (1.3.19 è uscita senza i due .dmg) e il run risultava
  # comunque concluso dai job Linux e Windows.
  completa:
    name: Release completa
    needs: [build, checksums]
    if: >-
      always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che non manchi nessun allegato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          attesi=(
            "Naturopata-Digitale-Windows-x64.exe"
            "Naturopata-Digitale-Windows-portatile.zip"
            "Naturopata-Digitale-Linux-amd64.deb"
            "Naturopata-Digitale-Linux-x86_64.AppImage"
            "Naturopata-Digitale-Mac-x64.dmg"
            "Naturopata-Digitale-Mac-arm64.dmg"
            "Naturopata-Digitale-Come-si-installa.pdf"
            "Naturopata-Digitale-Scheda-rapida.pdf"
            "Naturopata-Digitale-Lista-di-prova.pdf"
            "Naturopata-Digitale-Lista-di-prova-rapida.pdf"
            "Naturopata-Digitale-Sorgenti.zip"
            "SHA256SUMS.txt"
          )
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > presenti.txt
          mancanti=0
          for file in "${attesi[@]}"; do
            if grep -qxF "$file" presenti.txt; then
              echo "ok  $file"
            else
              echo "::error title=Pacchetto mancante::$TAG non contiene $file"
              mancanti=$((mancanti + 1))
            fi
          done
          if [[ "$mancanti" -gt 0 ]]; then
            echo "::notice::Per completare la release rilancia il job annullato o fallito (Re-run failed jobs), poi questo controllo."
            exit 1
          fi
          echo "Release $TAG completa: ${#attesi[@]} file attesi presenti."
