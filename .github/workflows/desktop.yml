name: Pacchetti desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: "desktop-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: macos-latest
            script: dist:mac
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepara il contenuto dell'app
        run: node scripts/prepare-desktop.cjs

      - name: Installa Electron
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Genera i pacchetti
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: naturopata-digitale-${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Pubblica nella release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
          generate_release_notes: true
